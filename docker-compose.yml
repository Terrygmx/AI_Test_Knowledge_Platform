# PostgreSQL 17 + pgvector 0.8.x
# 说明：本机当前未安装 Docker，此文件为「备好待用」状态。
# 需要数据库时执行：docker compose up -d
# 首次启动会自动执行 sql/init/*.sql 完成建表。
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aitkp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_test_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # 中文全文检索所需的默认分词配置（zhparser 需另行安装镜像）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_test_knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
    name: aitkp-pgdata
