# PostgreSQL 17 + pgvector 0.8.x
#
# 用法：
#   docker compose up -d          # 启动数据库
#   uv run alembic upgrade head   # 建表（Schema 由 Alembic 管理，见 alembic/versions/）
#
# 说明：不再把 *.sql 挂到 docker-entrypoint-initdb.d。
# 以前「DDL 文件 + ORM」两份 Schema 必然漂移，现在单一事实来源是 ORM（app/models），
# 迁移脚本即 Schema 的版本化投影；pgvector / pg_trgm 扩展也在迁移里创建。
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: aitkp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_test_knowledge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # 中文全文检索所需的默认分词配置（zhparser 需另行安装镜像）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_test_knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
    name: aitkp-pgdata
