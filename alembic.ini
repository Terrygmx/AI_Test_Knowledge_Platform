# Alembic 配置。
#
# 说明：
# - script_location 指向 alembic/（版本脚本目录）
# - sqlalchemy.url 不在这里写死，由 alembic/env.py 从 app.core.config 读取，
#   保证连接参数只有 .env 一个来源
# - prepend_sys_path = . 让 env.py 能 import app.*

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url =

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
