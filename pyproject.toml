[project]
name = "ai-test-knowledge-platform"
version = "0.1.0"
description = "测试工程知识智能平台：Hybrid Retrieval + Rerank + RAG，面向测试知识与回归测试 Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # ---------- Web / API ----------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # ---------- 配置与数据校验 ----------
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # ---------- 数据库：PostgreSQL + pgvector ----------
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    # ---------- LLM / Embedding / Rerank（统一走 OpenAI-compatible 接口）----------
    "openai>=1.57",
    "httpx>=0.27",
    "tenacity>=9.0",
    # ---------- 数据接入 ----------
    "pandas>=2.2",
    "openpyxl>=3.1",
    "markdown-it-py>=3.0",
    "pypdf>=5.1",
    # ---------- 计算 / 评测 ----------
    "numpy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ipython>=8.30",
    "pyyaml>=6.0.3",
]

# 本项目按应用方式部署（uvicorn app.main:app），不作为库分发，
# 故不声明 build-system：uv sync 只装依赖，不把 app 打包安装。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
