[project]
name = "ai-test-knowledge-platform"
version = "0.1.0"
description = "基于 RAG + Agent 的测试知识平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 待项目方案确定后补充
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_test_knowledge_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
