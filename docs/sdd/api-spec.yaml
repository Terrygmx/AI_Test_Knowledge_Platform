components:
  schemas:
    BadcaseAdvance:
      properties:
        evaluation_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Evaluation Result
      type: object
      title: BadcaseAdvance
      description: 推进闭环状态的请求体；verified 必须提供评测结果。
    BadcaseCreate:
      properties:
        badcase_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Badcase Id
        query_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Query Id
        stage:
          $ref: '#/components/schemas/BadcaseStage'
        symptom:
          type: string
          minLength: 1
          title: Symptom
        root_cause:
          type: string
          minLength: 1
          title: Root Cause
        hypothesis:
          type: string
          minLength: 1
          title: Hypothesis
        regression_query_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Regression Query Ids
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - badcase_id
      - query_id
      - stage
      - symptom
      - root_cause
      - hypothesis
      - regression_query_ids
      title: BadcaseCreate
      description: 创建 Badcase 的请求体，字段语义与 Phase 19 契约一致。
    BadcaseRead:
      properties:
        badcase_id:
          type: string
          title: Badcase Id
        query_id:
          type: string
          title: Query Id
        stage:
          $ref: '#/components/schemas/BadcaseStage'
        symptom:
          type: string
          title: Symptom
        root_cause:
          type: string
          title: Root Cause
        hypothesis:
          type: string
          title: Hypothesis
        regression_query_ids:
          items:
            type: string
          type: array
          title: Regression Query Ids
        status:
          $ref: '#/components/schemas/BadcaseStatus'
        evaluation_result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Evaluation Result
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - badcase_id
      - query_id
      - stage
      - symptom
      - root_cause
      - hypothesis
      - regression_query_ids
      - status
      title: BadcaseRead
      description: Badcase 读取视图。
    BadcaseStage:
      type: string
      enum:
      - parser
      - chunk
      - embedding
      - query
      - retrieval
      - rerank
      - context
      - generation
      - citation
      title: BadcaseStage
      description: Badcase 归因的 Pipeline 阶段。
    BadcaseStatus:
      type: string
      enum:
      - open
      - fixing
      - fixed
      - verified
      title: BadcaseStatus
      description: 闭环状态；只能按 open → fixing → fixed → verified 顺序推进。
    CaseType:
      type: string
      enum:
      - smoke
      - functional
      - regression
      - performance
      - security
      - compatibility
      title: CaseType
      description: 用例类型。
    Citation:
      properties:
        chunk_id:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Chunk Id
          description: knowledge_chunks 主键；离线实验没有数据库行时可为空
        source_type:
          type: string
          enum:
          - testcase
          - defect
          - requirement
          - document
          title: Source Type
        source_id:
          type: string
          title: Source Id
        chunk_index:
          type: integer
          minimum: 0.0
          title: Chunk Index
        snippet:
          type: string
          title: Snippet
        rank:
          type: integer
          minimum: 1.0
          title: Rank
          description: 本次检索排序，从 1 开始
        distance:
          anyOf:
          - type: number
          - type: 'null'
          title: Distance
          description: cosine distance；越小越相似，仅 PostgreSQL 检索可用
        retriever:
          type: string
          enum:
          - vector
          - keyword
          - hybrid
          - rerank
          title: Retriever
          description: 产生该证据的检索器
          default: vector
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
          description: 检索器原始分数；vector 使用 cosine distance，BM25 使用相关度分数
      type: object
      required:
      - source_type
      - source_id
      - chunk_index
      - snippet
      - rank
      title: Citation
      description: 回答引用的知识片段，业务编号是最终追溯锚点。
    DefectCreate:
      properties:
        bug_id:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Bug Id
          description: 业务编号，如 BUG-1021
          examples:
          - BUG-1021
        title:
          type: string
          minLength: 1
          title: Title
          description: 缺陷标题
        module:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Module
        version:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Version
          description: 发现版本
        severity:
          anyOf:
          - $ref: '#/components/schemas/Severity'
          - type: 'null'
          description: 严重程度
        priority:
          anyOf:
          - $ref: '#/components/schemas/Priority'
          - type: 'null'
          description: 优先级 P0-P3
        status:
          anyOf:
          - $ref: '#/components/schemas/DefectStatus'
          - type: 'null'
          description: 缺陷状态
        reproduce_steps:
          anyOf:
          - type: string
          - type: 'null'
          title: Reproduce Steps
          description: 复现步骤
        root_cause:
          anyOf:
          - type: string
          - type: 'null'
          title: Root Cause
          description: 根因分析
        resolution:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolution
          description: 解决方案
        related_cases:
          items:
            type: string
          type: array
          title: Related Cases
          description: 关联用例编号
        source:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
