openapi: 3.1.0
info:
  title: AI Test Knowledge Platform
  description: '面向测试工程的知识智能平台：结构化知识建模 + Hybrid Retrieval + Rerank + RAG。


    - Retrieval First：先证明检索正确，再做生成

    - Evidence First：回答必须有来源，不凭空生成 Case ID / Bug ID

    - Evaluation First-class：改 Chunk / Embedding / TopK / Rerank 都可重新评测'
  version: 0.1.0
